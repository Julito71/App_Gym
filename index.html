<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gym Pro">
    <title>Entrenamiento</title>
    <style>
        :root {
            --ios-bg: #000000;
            --ios-card: #1c1c1e;
            --ios-card-active: #2c2c2e;
            --ios-blue: #0a84ff;
            --ios-green: #30d158;
            --ios-orange: #ff9f0a;
            --ios-red: #ff453a;
            --ios-text: #ffffff;
            --ios-subtext: #8e8e93;
            --ios-border: rgba(255, 255, 255, 0.08);
            --ios-input-bg: #2c2c2e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
            background-color: var(--ios-bg);
            color: var(--ios-text);
            margin: 0;
            padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px) 16px;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 440px;
            margin: 0 auto;
        }

        /* Cabecera Tipo Apple Health/Fitness */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .app-title-group h1 {
            font-size: 34px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.8px;
            line-height: 1.1;
        }

        .app-title-group p {
            font-size: 14px;
            color: var(--ios-subtext);
            margin: 4px 0 0 0;
            font-weight: 500;
        }

        .btn-ios-reset {
            background-color: rgba(255, 69, 58, 0.12);
            color: var(--ios-red);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: active 0.2s;
        }

        .btn-ios-reset:active {
            opacity: 0.6;
        }

        /* Tarjeta de Ejercicio Pro */
        .exercise-card {
            background-color: var(--ios-card);
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 12px;
            border: 1px solid var(--ios-border);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .exercise-card.active {
            background-color: var(--ios-card-active);
            border: 1.5px solid var(--ios-blue);
            box-shadow: 0 4px 20px rgba(10, 132, 255, 0.15);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .exercise-name {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: var(--ios-text);
        }

        .exercise-badge {
            background: rgba(10, 132, 255, 0.12);
            color: var(--ios-blue);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: -0.2px;
        }

        .exercise-badge.completed {
            background: rgba(48, 209, 88, 0.12);
            color: var(--ios-green);
        }

        .exercise-control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 10px 8px 14px;
            border-radius: 14px;
            min-height: 52px;
        }

        .exercise-meta {
            font-size: 14px;
            color: var(--ios-subtext);
            font-weight: 500;
        }

        /* Input de Peso de Alta Visibilidad */
        .weight-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="number"] {
            background: var(--ios-input-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            padding: 8px 12px;
            width: 72px;
            text-align: center;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="number"]:focus {
            border-color: var(--ios-blue);
        }

        /* Botón Primario de Acción */
        .btn-action {
            background-color: var(--ios-blue);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.15s ease;
        }

        .btn-action:active {
            opacity: 0.7;
        }

        .btn-action.completed {
            background-color: rgba(48, 209, 88, 0.15);
            color: var(--ios-green);
            cursor: default;
        }

        .btn-action.disabled {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--ios-subtext);
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Island Timer Superior */
        .timer-island {
            position: fixed;
            top: calc(env(safe-area-inset-top) + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
        }

        .timer-island.visible {
            transform: translateX(-50%) translateY(0);
        }

        .timer-value {
            font-size: 17px;
            font-weight: 700;
            color: var(--ios-orange);
            font-variant-numeric: tabular-nums;
        }

        /* Sección de Historial */
        .history-box {
            background-color: var(--ios-card);
            border-radius: 20px;
            padding: 18px;
            margin-top: 24px;
            border: 1px solid var(--ios-border);
        }

        .history-row {
            font-size: 13px;
            color: var(--ios-subtext);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        .history-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="app-title-group">
            <h1>Entrenamiento</h1>
            <p>Rutina Gym Libre</p>
        </div>
        <button class="btn-ios-reset" onclick="resetRoutine()">Reiniciar</button>
    </header>

    <div id="exercises-list"></div>

    <div class="history-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <span style="font-weight:600; font-size:15px; color:var(--ios-blue);">Historial de Hoy</span>
            <button onclick="clearHistory()" style="background:none; border:none; color:var(--ios-red); font-size:12px; cursor:pointer;">Limpiar</button>
        </div>
        <div id="history-list"></div>
    </div>
</div>

<div class="timer-island" id="timer-island">
    <span id="timer-label">⏱️ Descanso</span>
    <span class="timer-value" id="timer-count">60s</span>
</div>

<script>
    const exercises = [
        { id: 1, name: "5 min Calentamiento Bici", totalSets: 1, weights: false, reps: "5 min", isBike: true },
        { id: 2, name: "Pecho Banco Inclinado", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 3, name: "Bíceps", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 4, name: "Abdominales Laterales de Pie", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 5, name: "Hombros Adelante", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 6, name: "Pecho Acostado", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 7, name: "Piernas (rodillo empeine)", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 8, name: "Abdominales", totalSets: 4, weights: false, reps: "25 reps" },
        { id: 9, name: "Remo", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 10, name: "Press Piernas", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 11, name: "Tríceps Acostado", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 12, name: "Dorsales Pecho", totalSets: 3, weights: true, reps: "15 reps" }
    ];

    let activeExerciseId = localStorage.getItem('active_exercise_id') ? parseInt(localStorage.getItem('active_exercise_id')) : null;
    let timerEndTime = null;
    let timerInterval = null;

    function startTimer(durationInSeconds, label, onComplete) {
        timerEndTime = Date.now() + (durationInSeconds * 1000);
        const island = document.getElementById('timer-island');
        const countEl = document.getElementById('timer-count');
        const labelEl = document.getElementById('timer-label');
        
        labelEl.textContent = label;
        island.classList.add('visible');

        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            const remaining = Math.round((timerEndTime - Date.now()) / 1000);

            if (remaining <= 0) {
                clearInterval(timerInterval);
                island.classList.remove('visible');

                if (navigator.vibrate) {
                    navigator.vibrate([500, 200, 500]);
                }

                if (onComplete) onComplete();
            } else {
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                countEl.textContent = mins > 0 ? `${mins}:${secs < 10 ? '0' : ''}${secs}` : `${secs}s`;
            }
        }, 500);
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    }

    function selectExercise(exId) {
        if (activeExerciseId !== null && activeExerciseId !== exId) {
            const activeEx = exercises.find(e => e.id === activeExerciseId);
            const currentSet = parseInt(localStorage.getItem(`set_current_${activeEx.id}`) || '1');
            if (currentSet <= activeEx.totalSets) {
                alert(`Debes completar las series de "${activeEx.name}" primero.`);
                return;
            }
        }

        activeExerciseId = exId;
        localStorage.setItem('active_exercise_id', exId);
        const ex = exercises.find(e => e.id === exId);
        speakText(`Iniciando ${ex.name}`);
        renderExercises();
    }

    function startBikeTimer(exIdx) {
        selectExercise(1);
        startTimer(300, "🚴 Bici 5m", () => {
            logHistory("5 min Calentamiento Bici", 1, "Sin peso");
            localStorage.setItem(`set_current_1`, 2);
            localStorage.removeItem('active_exercise_id');
            activeExerciseId = null;
            renderExercises();
            speakText("Calentamiento completado. Selecciona tu siguiente ejercicio.");
        });
    }

    function renderExercises() {
        const container = document.getElementById('exercises-list');
        container.innerHTML = '';

        exercises.forEach((ex, exIdx) => {
            const currentSet = parseInt(localStorage.getItem(`set_current_${ex.id}`) || '1');
            const savedWeight = localStorage.getItem(`weight_${ex.id}`) || '';
            const isActive = activeExerciseId === ex.id;
            const isFinished = currentSet > ex.totalSets;
            const isBlocked = activeExerciseId !== null && activeExerciseId !== ex.id && !isFinished;

            const card = document.createElement('div');
            card.className = `exercise-card ${isActive ? 'active' : ''}`;
            
            let actionButton = '';
            if (isFinished) {
                actionButton = `<button class="btn-action completed">✓ Listo</button>`;
            } else if (ex.isBike) {
                actionButton = `<button class="btn-action" onclick="startBikeTimer(${exIdx})">Iniciar 5m</button>`;
            } else if (isActive) {
                actionButton = `<button class="btn-action" onclick="completeSet(${exIdx})">Completar Serie</button>`;
            } else {
                actionButton = `<button class="btn-action ${isBlocked ? 'disabled' : ''}" onclick="selectExercise(${ex.id})">Seleccionar</button>`;
            }

            card.innerHTML = `
                <div class="exercise-header">
                    <span class="exercise-name">${exIdx + 1}. ${ex.name}</span>
                    <span class="exercise-badge ${isFinished ? 'completed' : ''}">${isFinished ? 'Completado' : `Serie ${Math.min(currentSet, ex.totalSets)}/${ex.totalSets}`}</span>
                </div>
                <div class="exercise-control-row">
                    <span class="exercise-meta">${ex.weights ? 'Peso (kg)' : (ex.isBike ? 'Calentamiento' : 'Sin peso')}</span>
                    <div class="weight-input-group">
                        ${ex.weights ? `<input type="number" inputmode="decimal" pattern="[0-9]*" value="${savedWeight}" placeholder="0" onchange="saveWeight(${ex.id}, this.value)">` : ''}
                        ${actionButton}
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        renderHistory();
    }

    function saveWeight(id, val) {
        localStorage.setItem(`weight_${id}`, val);
    }

    function logHistory(exerciseName, setNum, weight) {
        const history = JSON.parse(localStorage.getItem('routine_history_full') || '[]');
        const now = new Date();
        const timeStr = `${now.toLocaleDateString()} ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        
        history.unshift({ time: timeStr, text: `${exerciseName} - Serie ${setNum}`, detail: weight ? `${weight} kg` : 'Sin peso' });
        localStorage.setItem('routine_history_full', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const historyEl = document.getElementById('history-list');
        const history = JSON.parse(localStorage.getItem('routine_history_full') || '[]');
        if (history.length === 0) {
            historyEl.innerHTML = '<div class="history-row"><span>Sin registros hoy.</span></div>';
            return;
        }
        historyEl.innerHTML = history.slice(0, 20).map(item => `
            <div class="history-row">
                <span><strong>${item.text}</strong></span>
                <span style="color:var(--ios-subtext);">${item.detail} (${item.time.split(' ')[1]})</span>
            </div>
        `).join('');
    }

    function clearHistory() {
        if (confirm("¿Borrar el historial?")) {
            localStorage.removeItem('routine_history_full');
            renderHistory();
        }
    }

    function resetRoutine() {
        if (confirm("¿Reiniciar la rutina de hoy?")) {
            exercises.forEach(ex => {
                localStorage.removeItem(`set_current_${ex.id}`);
            });
            localStorage.removeItem('active_exercise_id');
            activeExerciseId = null;
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timer-island').classList.remove('visible');
            renderExercises();
        }
    }

    function completeSet(exIdx) {
        const ex = exercises[exIdx];
        let currentSet = parseInt(localStorage.getItem(`set_current_${ex.id}`) || '1');
        const weight = localStorage.getItem(`weight_${ex.id}`) || '';

        if (currentSet <= ex.totalSets) {
            logHistory(ex.name, currentSet, weight);
            currentSet++;
            localStorage.setItem(`set_current_${ex.id}`, currentSet);
        }

        if (currentSet > ex.totalSets) {
            localStorage.removeItem('active_exercise_id');
            activeExerciseId = null;
        }

        renderExercises();

        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200]);
        }

        let nextMsg = currentSet <= ex.totalSets ? `Siguiente: Serie ${currentSet}` : `¡Ejercicio completado!`;

        startTimer(60, "⏱️ Descanso", () => {
            speakText(`Descanso terminado. ${nextMsg}`);
        });
    }

    renderExercises();
</script>
</body>
</html>
