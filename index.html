<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .checked { background-color: #059669 !important; border-color: #059669 !important; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <div class="max-w-xl mx-auto p-4 pb-24">
        <header class="flex justify-between items-center mb-8 pt-4">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">GymPro <span class="text-emerald-500">Log</span></h1>
                <p class="text-gray-400 text-sm">Rutina de Entrenamiento Personal</p>
            </div>
            <button onclick="resetAll()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-400 px-3 py-2 rounded-lg transition">
                Reiniciar
            </button>
        </header>

        <!-- Main Timer / Cardio Section -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-8 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 id="timer-title" class="text-sm font-semibold uppercase tracking-wider text-gray-400">Calentamiento</h2>
                <span id="timer-display" class="text-3xl font-mono font-bold text-emerald-500">05:00</span>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button id="timer-btn" onclick="toggleTimer()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-900/20">
                    Iniciar
                </button>
                <button onclick="resetTimer()" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl transition">
                    Reiniciar
                </button>
            </div>
            <div class="mt-4 flex gap-2 overflow-x-auto pb-2">
                <button onclick="setTimer(300, 'Calentamiento')" class="whitespace-nowrap text-xs bg-gray-800 px-3 py-1.5 rounded-full hover:bg-gray-700">5m Cardio</button>
                <button onclick="setTimer(60, 'Descanso')" class="whitespace-nowrap text-xs bg-gray-800 px-3 py-1.5 rounded-full hover:bg-gray-700">1m Descanso</button>
                <button onclick="setTimer(90, 'Descanso')" class="whitespace-nowrap text-xs bg-gray-800 px-3 py-1.5 rounded-full hover:bg-gray-700">1:30m Descanso</button>
            </div>
        </div>

        <!-- Exercises List -->
        <div id="exercises-list" class="space-y-4">
            <!-- Exercices will be injected here -->
        </div>

        <!-- Footer Info -->
        <footer class="mt-12 text-center text-gray-600 text-xs">
            <p>Datos guardados localmente en este navegador.</p>
        </footer>
    </div>

    <!-- Notification Sound (Optional/Hidden) -->
    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script src="app.js"></script>
</body>
</html>
