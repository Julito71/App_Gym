<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gym & Fitness - Apple Style</title>
    <style>
        :root {
            --ios-bg: #000000;
            --ios-card: #1c1c1e;
            --ios-card-elevated: #2c2c2e;
            --ios-blue: #0a84ff;
            --ios-green: #30d158;
            --ios-orange: #ff9f0a;
            --ios-red: #ff453a;
            --ios-text: #ffffff;
            --ios-subtext: #8e8e93;
            --ios-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--ios-bg);
            color: var(--ios-text);
            margin: 0;
            padding: 20px 16px 100px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Apple Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
            padding-top: 10px;
        }

        .app-title-group h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .app-title-group p {
            font-size: 15px;
            color: var(--ios-subtext);
            margin: 4px 0 0 0;
        }

        /* Top Action Bar (Spotify & Reset) */
        .top-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-ios-spotify {
            background-color: #1db954;
            color: #000000;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            flex: 2;
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
        }

        .btn-ios-secondary {
            background-color: var(--ios-card);
            color: var(--ios-red);
            border: 1px solid rgba(255, 69, 58, 0.2);
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            flex: 1;
        }

        /* Tarjetas de Ejercicio Estilo Apple Watch / Fitness */
        .exercise-card {
            background-color: var(--ios-card);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
            border: 1px solid var(--ios-border);
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .exercise-card.active {
            background-color: var(--ios-card-elevated);
            border: 2px solid var(--ios-blue);
            box-shadow: 0 8px 24px rgba(10, 132, 255, 0.25);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .exercise-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--ios-text);
            letter-spacing: -0.3px;
        }

        .exercise-badge {
            background: rgba(10, 132, 255, 0.15);
            color: var(--ios-blue);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .exercise-badge.completed {
            background: rgba(48, 209, 88, 0.15);
            color: var(--ios-green);
        }

        .exercise-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border-radius: 12px;
        }

        .exercise-meta {
            font-size: 14px;
            color: var(--ios-subtext);
            font-weight: 500;
        }

        /* Inputs y Botones Estilo iOS */
        input[type="number"] {
            background: #3a3a3c;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            padding: 8px;
            width: 64px;
            text-align: center;
            outline: none;
        }

        .btn-action {
            background-color: var(--ios-blue);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-action:active {
            opacity: 0.7;
        }

        .btn-action.completed {
            background-color: var(--ios-green);
            color: #000000;
        }

        .btn-action.disabled {
            background-color: #3a3a3c;
            color: var(--ios-subtext);
            cursor: not-allowed;
        }

        /* Panel de Nutrición Estilo Fitia & Apple Health */
        .health-card {
            background-color: var(--ios-card);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--ios-border);
        }

        .health-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .macros-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 14px;
            text-align: center;
        }

        .macro-cell {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 8px;
            border-radius: 12px;
        }

        .macro-number {
            font-size: 16px;
            font-weight: 700;
            color: var(--ios-text);
        }

        .macro-label {
            font-size: 11px;
            color: var(--ios-subtext);
            margin-top: 2px;
        }

        /* Barra de Navegación Inferior Estilo iOS (Tab Bar) */
        .ios-tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--ios-border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 24px 0;
            z-index: 1000;
        }

        .tab-item {
            background: none;
            border: none;
            color: var(--ios-subtext);
            font-size: 11px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 50%;
        }

        .tab-item.active {
            color: var(--ios-blue);
        }

        .tab-icon {
            font-size: 22px;
        }

        /* Contenedor de Pestañas */
        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        /* Overlay Flotante de Descanso (Dynamic Island Style) */
        .timer-island {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 10px 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
        }

        .timer-island.visible {
            transform: translateX(-50%) translateY(0);
        }

        .timer-value {
            font-size: 17px;
            font-weight: 700;
            color: var(--ios-orange);
        }

        .history-box {
            background-color: var(--ios-card);
            border-radius: 20px;
            padding: 18px;
            margin-top: 24px;
            border: 1px solid var(--ios-border);
        }

        .history-row {
            font-size: 13px;
            color: var(--ios-subtext);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 8px 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="app-title-group">
            <h1>Entrenamiento</h1>
            <p id="header-subtitle">Modo Libre Activo</p>
        </div>
    </header>

    <!-- Barra Superior de Acciones Rápidas -->
    <div class="top-actions">
        <a href="spotify://" class="btn-ios-spotify">🎵 Abrir Spotify</a>
        <button class="btn-ios-secondary" onclick="resetRoutine()">Reiniciar</button>
    </div>

    <!-- PESTAÑA 1: RUTINA -->
    <div id="pane-workout" class="tab-pane active">
        <div id="exercises-list"></div>

        <div class="history-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="font-weight:600; font-size:15px; color:var(--ios-blue);">Historial de Sesión</span>
                <button onclick="clearHistory()" style="background:none; border:none; color:var(--ios-red); font-size:12px; cursor:pointer;">Limpiar</button>
            </div>
            <div id="history-list"></div>
        </div>
    </div>

    <!-- PESTAÑA 2: NUTRICIÓN -->
    <div id="pane-nutrition" class="tab-pane">
        <div class="health-card">
            <div class="health-title">🔥 Calorías Diarias</div>
            <div style="display:flex; justify-content:space-between; align-items:baseline;">
                <div>
                    <span style="font-size: 32px; font-weight: 700;" id="consumed-calories">450</span>
                    <span style="color: var(--ios-subtext);">/ 2,200 kcal</span>
                </div>
                <button class="btn-action" onclick="addMeal()">+ Registrar</button>
            </div>
            <div class="macros-row">
                <div class="macro-cell">
                    <div class="macro-number" id="macro-prot">45g</div>
                    <div class="macro-label">Proteínas</div>
                </div>
                <div class="macro-cell">
                    <div class="macro-number" id="macro-carb">60g</div>
                    <div class="macro-label">Carbos</div>
                </div>
                <div class="macro-cell">
                    <div class="macro-number" id="macro-fat">15g</div>
                    <div class="macro-label">Grasas</div>
                </div>
            </div>
        </div>

        <div class="health-card">
            <div class="health-title">💧 Control de Agua</div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <span style="font-size: 28px; font-weight: 700;" id="water-count">1.2 L</span>
                    <span style="color: var(--ios-subtext);">/ 2.5 L</span>
                </div>
                <button class="btn-action" onclick="addWater()">+ 250 ml</button>
            </div>
        </div>
    </div>
</div>

<!-- Dynamic Island Timer (Notificación Flotante Estilo iOS) -->
<div class="timer-island" id="timer-island">
    <span id="timer-label">⏱️ Descanso</span>
    <span class="timer-value" id="timer-count">60s</span>
</div>

<!-- Tab Bar Inferior Estilo iOS -->
<nav class="ios-tabbar">
    <button class="tab-item active" onclick="switchTab('workout')" id="tab-btn-workout">
        <span class="tab-icon">⚡️</span>
        <span>Entreno</span>
    </button>
    <button class="tab-item" onclick="switchTab('nutrition')" id="tab-btn-nutrition">
        <span class="tab-icon">🥗</span>
        <span>Nutrición</span>
    </button>
</nav>

<script>
    const exercises = [
        { id: 1, name: "5 min Calentamiento Bici", totalSets: 1, weights: false, reps: "5 min", isBike: true },
        { id: 2, name: "Pecho Banco Inclinado", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 3, name: "Bíceps", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 4, name: "Abdominales Laterales de Pie", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 5, name: "Hombros Adelante", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 6, name: "Pecho Acostado", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 7, name: "Piernas (rodillo empeine)", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 8, name: "Abdominales", totalSets: 4, weights: false, reps: "25 reps" },
        { id: 9, name: "Remo", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 10, name: "Press Piernas", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 11, name: "Tríceps Acostado", totalSets: 3, weights: true, reps: "15 reps" },
        { id: 12, name: "Dorsales Pecho", totalSets: 3, weights: true, reps: "15 reps" }
    ];

    let activeExerciseId = localStorage.getItem('active_exercise_id') ? parseInt(localStorage.getItem('active_exercise_id')) : null;
    let timerEndTime = null;
    let timerInterval = null;

    function switchTab(tabName) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        
        if (tabName === 'workout') {
            document.getElementById('pane-workout').classList.add('active');
            document.getElementById('tab-btn-workout').classList.add('active');
        } else {
            document.getElementById('pane-nutrition').classList.add('active');
            document.getElementById('tab-btn-nutrition').classList.add('active');
            loadNutritionData();
        }
    }

    function startTimer(durationInSeconds, label, onComplete) {
        timerEndTime = Date.now() + (durationInSeconds * 1000);
        const island = document.getElementById('timer-island');
        const countEl = document.getElementById('timer-count');
        const labelEl = document.getElementById('timer-label');
        
        labelEl.textContent = label;
        island.classList.add('visible');

        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            const remaining = Math.round((timerEndTime - Date.now()) / 1000);

            if (remaining <= 0) {
                clearInterval(timerInterval);
                island.classList.remove('visible');

                if (navigator.vibrate) {
                    navigator.vibrate([500, 200, 500]);
                }

                if (onComplete) onComplete();
            } else {
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                countEl.textContent = mins > 0 ? `${mins}:${secs < 10 ? '0' : ''}${secs}` : `${secs}s`;
            }
        }, 500);
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    }

    function selectExercise(exId) {
        if (activeExerciseId !== null && activeExerciseId !== exId) {
            const activeEx = exercises.find(e => e.id === activeExerciseId);
            const currentSet = parseInt(localStorage.getItem(`set_current_${activeEx.id}`) || '1');
            if (currentSet <= activeEx.totalSets) {
                alert(`Debes completar las series de "${activeEx.name}" primero.`);
                return;
            }
        }

        activeExerciseId = exId;
        localStorage.setItem('active_exercise_id', exId);
        const ex = exercises.find(e => e.id === exId);
        speakText(`Iniciando ${ex.name}`);
        renderExercises();
    }

    function startBikeTimer(exIdx) {
        selectExercise(1);
        startTimer(300, "🚴 Bici (5m)", () => {
            logHistory("5 min Calentamiento Bici", 1, "Sin peso");
            localStorage.setItem(`set_current_1`, 2);
            localStorage.removeItem('active_exercise_id');
            activeExerciseId = null;
            renderExercises();
            speakText("Calentamiento completado. Selecciona tu siguiente ejercicio.");
        });
    }

    function renderExercises() {
        const container = document.getElementById('exercises-list');
        container.innerHTML = '';

        exercises.forEach((ex, exIdx) => {
            const currentSet = parseInt(localStorage.getItem(`set_current_${ex.id}`) || '1');
            const savedWeight = localStorage.getItem(`weight_${ex.id}`) || '';
            const isActive = activeExerciseId === ex.id;
            const isFinished = currentSet > ex.totalSets;
            const isBlocked = activeExerciseId !== null && activeExerciseId !== ex.id && !isFinished;

            const card = document.createElement('div');
            card.className = `exercise-card ${isActive ? 'active' : ''}`;
            
            let actionButton = '';
            if (isFinished) {
                actionButton = `<span class="exercise-badge completed">Completado</span>`;
            } else if (ex.isBike) {
                actionButton = `<button class="btn-action" onclick="startBikeTimer(${exIdx})">Iniciar 5m</button>`;
            } else if (isActive) {
                actionButton = `<button class="btn-action" onclick="completeSet(${exIdx})">Completar Serie</button>`;
            } else {
                actionButton = `<button class="btn-action ${isBlocked ? 'disabled' : ''}" onclick="selectExercise(${ex.id})">Seleccionar</button>`;
            }

            card.innerHTML = `
                <div class="exercise-header">
                    <span class="exercise-name">${exIdx + 1}. ${ex.name}</span>
                    <span class="exercise-badge">${isFinished ? '✓' : `Serie ${Math.min(currentSet, ex.totalSets)}/${ex.totalSets}`}</span>
                </div>
                <div class="exercise-footer">
                    <span class="exercise-meta">${ex.weights ? 'Peso (kg):' : (ex.isBike ? 'Cardio 5 min' : 'Libre')}</span>
                    ${ex.weights ? `<input type="number" inputmode="decimal" pattern="[0-9]*" value="${savedWeight}" placeholder="0" onchange="saveWeight(${ex.id}, this.value)">` : ''}
                    ${actionButton}
                </div>
            `;
            container.appendChild(card);
        });

        renderHistory();
    }

    function saveWeight(id, val) {
        localStorage.setItem(`weight_${id}`, val);
    }

    function logHistory(exerciseName, setNum, weight) {
        const history = JSON.parse(localStorage.getItem('routine_history_full') || '[]');
        const now = new Date();
        const timeStr = `${now.toLocaleDateString()} ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        
        history.unshift({ time: timeStr, text: `${exerciseName} - Serie ${setNum} (${weight ? weight + ' kg' : 'Sin peso'})` });
        localStorage.setItem('routine_history_full', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const historyEl = document.getElementById('history-list');
        const history = JSON.parse(localStorage.getItem('routine_history_full') || '[]');
        if (history.length === 0) {
            historyEl.innerHTML = '<div class="history-row">Sin registros en esta sesión.</div>';
            return;
        }
        historyEl.innerHTML = history.slice(0, 25).map(item => `<div class="history-row"><strong>${item.time}</strong>: ${item.text}</div>`).join('');
    }

    function clearHistory() {
        if (confirm("¿Borrar el historial guardado?")) {
            localStorage.removeItem('routine_history_full');
            renderHistory();
        }
    }

    function resetRoutine() {
        if (confirm("¿Reiniciar el progreso de la rutina de hoy?")) {
            exercises.forEach(ex => {
                localStorage.removeItem(`set_current_${ex.id}`);
            });
            localStorage.removeItem('active_exercise_id');
            activeExerciseId = null;
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timer-island').classList.remove('visible');
            renderExercises();
        }
    }

    function completeSet(exIdx) {
        const ex = exercises[exIdx];
        let currentSet = parseInt(localStorage.getItem(`set_current_${ex.id}`) || '1');
        const weight = localStorage.getItem(`weight_${ex.id}`) || '';

        if (currentSet <= ex.totalSets) {
            logHistory(ex.name, currentSet, weight);
            currentSet++;
            localStorage.setItem(`set_current_${ex.id}`, currentSet);
        }

        if (currentSet > ex.totalSets) {
            localStorage.removeItem('active_exercise_id');
            activeExerciseId = null;
        }

        renderExercises();

        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200]);
        }

        let nextMsg = currentSet <= ex.totalSets ? `Siguiente: Serie ${currentSet}` : `¡Ejercicio completado!`;

        startTimer(60, "⏱️ Descanso", () => {
            speakText(`Descanso terminado. ${nextMsg}`);
        });
    }

    function loadNutritionData() {
        document.getElementById('consumed-calories').textContent = localStorage.getItem('fitia_calories') || '450';
        document.getElementById('macro-prot').textContent = localStorage.getItem('fitia_prot') || '45g';
        document.getElementById('macro-carb').textContent = localStorage.getItem('fitia_carb') || '60g';
        document.getElementById('macro-fat').textContent = localStorage.getItem('fitia_fat') || '15g';
        document.getElementById('water-count').textContent = (localStorage.getItem('fitia_water') || '1.2') + ' L';
    }

    function addMeal() {
        let cals = parseInt(localStorage.getItem('fitia_calories') || '450') + 350;
        localStorage.setItem('fitia_calories', cals);
        localStorage.setItem('fitia_prot', '75g');
        localStorage.setItem('fitia_carb', '90g');
        localStorage.setItem('fitia_fat', '25g');
        loadNutritionData();
        speakText("Comida registrada correctamente.");
    }

    function addWater() {
        let water = parseFloat(localStorage.getItem('fitia_water') || '1.2');
        water = Math.min(3.0, parseFloat((water + 0.25).toFixed(2)));
        localStorage.setItem('fitia_water', water);
        loadNutritionData();
    }

    renderExercises();
</script>
</body>
</html>
